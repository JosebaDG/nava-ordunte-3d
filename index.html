<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#102a28">
  <meta name="description" content="Laboratorio comunitario para explorar Nava de Ordunte y el Valle de Mena en 3D.">
  <title>Nava de Ordunte · Laboratorio 3D</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://www.ign.es" crossorigin>
  <link rel="preconnect" href="https://tiles.mapterhorn.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <main id="map" aria-label="Mapa tridimensional de Nava de Ordunte"></main>
  <section id="fallback" hidden aria-label="Vista de respaldo">
    <img id="fallback-image" alt="Ortofoto oficial del entorno de Nava de Ordunte">
    <div class="fallback-marker" aria-hidden="true"></div>
  </section>

  <header class="panel hero">
    <div class="eyebrow"><span class="live-dot"></span> Laboratorio abierto <span>v0.2</span></div>
    <h1>Nava de Ordunte</h1>
    <p>El valle comienza en la plaza. Relieve real, ortofoto pública y rutas de la comunidad.</p>
    <div class="controls" aria-label="Controles principales">
      <button id="fly" class="primary" disabled>↗ Revelar el valle</button>
      <button id="home" disabled>◎ Plaza</button>
      <button id="layer" disabled>◈ Solo relieve</button>
      <label class="button" for="gpx">＋ Abrir GPX</label>
      <input id="gpx" type="file" accept=".gpx,application/gpx+xml,application/xml,text/xml">
    </div>
  </header>

  <aside id="status" class="status loading" role="status" aria-live="polite">
    <span class="spinner" aria-hidden="true"></span>
    <span id="status-text">Preparando el motor cartográfico…</span>
  </aside>

  <details id="diagnostics" class="panel diagnostics">
    <summary>Diagnóstico</summary>
    <pre id="diagnostic-log">Inicio de diagnóstico…</pre>
    <div class="controls"><button id="retry">Reintentar 3D</button><button id="copy-log">Copiar informe</button></div>
  </details>

  <noscript>Esta experiencia necesita JavaScript. Ábrela en Safari o en un navegador moderno.</noscript>
  <script src="app.js" defer></script>
</body>
</html>
